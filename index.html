button {

  color: white;
  border: none;
  border-radius: 12px;

}
button::before,
button::after {
  content: "🌸";
  position: absolute;
  font-size: 18px;
  opacity: 0.7;
}

button::before {
  top: -8px;
  left: -8px;
}

button::after {
  bottom: -8px;
  right: -8px;
}
button:active {
