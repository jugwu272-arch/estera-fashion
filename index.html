<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESTÉRA FASHION</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap" rel="stylesheet">

  <style>
body {
  font-family: 'Playfair Display', serif;
  margin: 0;
  background: #f9e4e7;
  text-align: center;
  color: #5a3a3a;
}

.hero {
  padding: 40px 20px 10px;
}

.hero img {
  width: 80%;
  max-width: 500px;
  border-radius: 20px;
}

.container {
  padding: 20px;
}

.product {
  background: #ffffff;
  border-radius: 20px;
  padding: 15px;
  margin: 15px;
  display: inline-block;
  width: 220px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.product img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 15px;
}

.product h3 {
  color: #a85c63;
}

.product p {
  color: #777;
}

button {
  background: #e8b4b8;
  color: #fff;
  border: none;
  padding: 10px;
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #d89aa0;
}

    header {
      background: #000;
      color: #fff;
      padding: 20px;
    }

    header h1 {
      letter-spacing: 4px;
      margin: 0;
    }

    header p {
      color: #f8cdd3;
      font-style: italic;
      margin-top: 5px;
    }

.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px; /* reduce space */
  padding: 10px;
}

.product {
  width: 100%;
  max-width: 160px; /* smaller for phone */
  margin: auto;
}

    .product {
      background: #fff;
      border-radius: 15px;
      padding: 15px;
      margin: 15px;
      display: inline-block;
      width: 220px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin: 10px 0 5px;
      color: #000;
    }

    .product p {
      margin: 5px 0;
      color: #555;
    }
@media (max-width: 600px) {
  .product {
    max-width: 150px;
  }
}
    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 8px;
      font-family: inherit;
    }

    button:hover {
      background: #f8cdd3;
      color: #000;
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      background: #000;
      color: #fff;
    }
  </style>
</head>

<<body>

  <!-- Logo Section -->
  <div class="hero">
    <img src="logo.jpg" alt="ESTÉRA Logo">
  </div>

<div class="container">

  <!-- Product 1 -->
  <div class="product">
    <img src="dress1.jpg">
    <h3>Red Dinner Dress</h3>
    <p>₦10,000</p>
    <button onclick="buyNow('Red Dinner Dress')">Buy Now</button>
  </div>

  <!-- Product 2 -->
  <div class="product">
    <img src="dress2.jpg">
    <h3>Casual 2-Piece</h3>
    <p>₦8,000</p>
    <button onclick="buyNow('Casual 2-Piece')">Buy Now</button>
  </div>

  <!-- Product 3 -->
  <div class="product">
    <img src="dress3.jpg">
    <h3>Elegant Pink Gown</h3>
    <p>₦12,000</p>
    <button onclick="buyNow('Elegant Pink Gown')">Buy Now</button>
  </div>

  <!-- Product 4 -->
  <div class="product">
    <img src="dress4.jpg">
    <h3>Street Style Outfit</h3>
    <p>₦9,000</p>
    <button onclick="buyNow('Street Style Outfit')">Buy Now</button>
  </div>

</div>

  </div>

</body>

  <!-- Footer -->
  <footer>
    <p>Contact: 2347042500623</p>
  </footer>

  <!-- Script -->
  <script>
    function buyNow(product) {
      let phone = "2347042500623"; // replace with your number
      let message = "Hello, I want to buy " + product;
      let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
